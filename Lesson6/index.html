<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 6 – Dashboard layout with CSS Grid</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="sidebar-left">
      <span>ByeWind</span>
    </div>
    <header>
      <span>Dashboards / Default</span>
    </header>
    <main>
      <section class="dashboard-container">
        <h1>Overview</h1>
        <div class="card bg-purple b-radius"><h2>Views</h2></div>
        <div class="card bg-blue b-radius"><h2>Visits</h2></div>
        <div class="card bg-purple b-radius"><h2>New Users</h2></div>
        <div class="card bg-blue b-radius"><h2>Active Users</h2></div>
        <div class="start-span-3 card bg-grey"><h2>Total Users</h2></div>
        <div class="card bg-grey b-radius b-radius"><h2>Traffic by Website</h2></div>
        <div class="start-span-2 card bg-grey b-radius"><h2>Traffic by Device</h2></div>
        <div class="middle-span-2 card bg-grey b-radius"><h2>Traffic by Location</h2></div>
      </section>
    </main>
    <div class="sidebar-right">
      <h3>Notifications</h3>
    </div>
  </body>
</html>
